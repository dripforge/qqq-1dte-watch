name: Feature request
description: Propose a focused improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed behavior
      description: What evidence, decision or developer workflow would this improve?
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation approach
      description: How could we test the improvement without real account data?
